[project]
name = "local-ai-benchmark"
version = "1.0.0"
description = "Offline small-language-model app and reproducible benchmark for models served by Ollama"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SaiCharan Nidiganti" }]
requires-python = ">=3.11"
keywords = ["llm", "slm", "ollama", "benchmark", "local-llm", "inference"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.6.0",
    "psutil>=6.0.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

# Development tools, installed by `uv sync` (or `pip install --group dev` with pip 25.1+).
[dependency-groups]
dev = [
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-psutil",
    "types-PyYAML",
]

[project.urls]
Repository = "https://github.com/saicharan-nidiganti/local-ai-benchmark"
Issues = "https://github.com/saicharan-nidiganti/local-ai-benchmark/issues"
Changelog = "https://github.com/saicharan-nidiganti/local-ai-benchmark/blob/main/CHANGELOG.md"

[project.scripts]
local-ai-benchmark = "local_ai_benchmark.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["local_ai_benchmark"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "C4"]
ignore = ["S101"]  # assert is fine in tests and for invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
