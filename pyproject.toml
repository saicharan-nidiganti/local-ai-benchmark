[project]
name = "local-ai-benchmark"
version = "0.1.0"
description = "Offline small-language-model app and reproducible benchmark for models served by Ollama"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "SaiCharan Nidiganti" }]
requires-python = ">=3.11"
keywords = ["llm", "slm", "ollama", "benchmark", "local-llm", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ollama>=0.6.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Repository = "https://github.com/saicharan-nidiganti/local-ai-benchmark"
Issues = "https://github.com/saicharan-nidiganti/local-ai-benchmark/issues"
Changelog = "https://github.com/saicharan-nidiganti/local-ai-benchmark/blob/main/CHANGELOG.md"

[project.scripts]
local-ai-benchmark = "local_ai_benchmark.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/local_ai_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
