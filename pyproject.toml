[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-benchmark"
version = "0.1.0"
description = "Offline local AI assistant and reproducible model benchmarking lab"
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.6.0",
    "psutil>=6.0.0",
    "pyyaml>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
