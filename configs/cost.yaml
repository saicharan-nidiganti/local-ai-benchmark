# Assumptions behind `report --cost` (docs/methodology.md, Cost). Every figure carries its
# source and the date it was read; change them for your own tariff, machine and providers.
currency: INR

electricity:
  price_per_kwh: 7.70
  note: >-
    TGSPDCL domestic tariff LT-I(B)(ii), 201 to 300 units a month: the marginal rate of a
    household in that band. FY 2025-26 retail supply tariff, TGERC order of 29 April 2025,
    unchanged in its November 2025 order.
  source: https://www.tgerc.telangana.gov.in/file_upload/uploads/Tariff%20Orders/Current%20Year%20Orders/2025/RST%20Order%20FY%202025-26%20FINAL.pdf
  as_of: 2026-11-13

hardware:
  price: 108990
  lifetime_years: 4
  hours_per_day: 8
  note: >-
    Retail listing of the ASUS ROG Strix G15 G513QC-HN125T (Ryzen 9 5900HX, RTX 3050 Laptop
    4 GB, 16 GB, 1 TB), last changed 21 April 2025; the 2021 launch price could not be
    confirmed. Counted as if the laptop did nothing else.
  source: https://www.smartprix.com/laptops/asus-rog-strix-g15-g513qc-hn125t-gaming-laptop-ppd1a5hw9yhe
  as_of: 2026-11-13

exchange:
  usd_to_local: 94.4776
  note: FBIL reference rate, 4 pm, 5 November 2026.
  source: https://www.fbil.org.in/
  as_of: 2026-11-05

# The same models on hosted APIs, USD per million tokens, keyed by Ollama tag.
hosted:
  qwen3:4b-instruct:
    provider: Fireworks AI (Qwen3-4B-Instruct-2507)
    input_per_million_usd: 0.20
    output_per_million_usd: 0.20
    note: Third-party listing; Fireworks was the only provider listed.
    source: https://pricepertoken.com/pricing-page/model/qwen-qwen3-4b-instruct-2507
