# Models known to the project. `--model` accepts an id from this list or any Ollama tag.
# The comparison uses the three `role: comparison` models (docs/decisions/0010).
models:
  - id: qwen3-4b-instruct
    name: qwen3:4b-instruct
    role: comparison
    quantization: Q4_K_M
  - id: phi4-mini
    name: phi4-mini
    role: comparison
    quantization: Q4_K_M
  - id: llama3.2-3b
    name: llama3.2:3b
    role: comparison
    quantization: Q4_K_M
  - id: qwen3-4b
    name: qwen3:4b
    role: baseline   # the v0.1.0 speed baseline; a thinking build
    quantization: Q4_K_M
  - id: phi4-mini-q8
    name: phi4-mini:3.8b-q8_0
    role: experiment   # Q4_K_M against Q8_0 (#26)
    quantization: Q8_0
